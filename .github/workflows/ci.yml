name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 代码风格与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 同步依赖
        run: uv sync --extra dev --extra plot
      - name: ruff 静态检查
        run: uv run ruff check .
      - name: ruff 格式检查
        run: uv run ruff format --check .

  typecheck:
    name: 类型检查 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 同步依赖
        run: uv sync --extra dev --extra plot --python ${{ matrix.python-version }}
      - name: mypy
        run: uv run --python ${{ matrix.python-version }} mypy

  test:
    name: 测试 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 同步依赖
        run: uv sync --extra dev --extra plot --python ${{ matrix.python-version }}
      - name: pytest
        run: uv run --python ${{ matrix.python-version }} pytest --cov=audioscope --cov-report=xml
      - name: 上传覆盖率
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
