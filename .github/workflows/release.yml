name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: 构建分发包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
      - name: 构建 sdist 与 wheel
        run: uv build
      - name: 检查产物
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI 可信发布（trusted publishing）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 发布
        uses: pypa/gh-action-pypi-publish@release/v1
