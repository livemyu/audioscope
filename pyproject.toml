[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audioscope"
version = "0.3.0"
description = "音频可视化工具包：波形 / 短时傅里叶谱 / 梅尔谱 / 色度 / 声谱图，支持交互式浏览与离线导出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Huang Yu", email = "251566018+livemyu@users.noreply.github.com" }]
keywords = ["audio", "visualization", "spectrogram", "mel", "chroma", "dsp", "numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.9",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.8",
]

[project.scripts]
audioscope = "audioscope.cli:main"

[project.urls]
Homepage = "https://github.com/livemyu/audioscope"
Repository = "https://github.com/livemyu/audioscope"
Documentation = "https://github.com/livemyu/audioscope/tree/main/docs"
Changelog = "https://github.com/livemyu/audioscope/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["audioscope"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["audioscope", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允许中文标点/全角字符

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
files = ["audioscope"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["audioscope"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
